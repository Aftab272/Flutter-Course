name: hospitalhistory
description: "My Medical History - A production-quality Flutter Android mobile healthcare application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  google_sign_in: ^6.3.0
  googleapis: ^13.2.0
  http: ^1.6.0
  local_auth: ^2.3.0
  geolocator: ^10.1.1
  geocoding: ^3.0.0
  image_picker: ^1.2.4
  file_picker: ^8.3.7
  intl: ^0.19.0
  uuid: ^4.6.0
  pdf: ^3.13.1
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
